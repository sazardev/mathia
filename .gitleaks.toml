# Configuración de gitleaks v8 — detección de secretos
# Extiende las reglas por defecto y añade reglas propias del proyecto.
[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos del proyecto"
paths = [
  '''(^|/)(package-lock\.json)$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)(go\.sum|yarn\.lock|pnpm-lock\.yaml)$''',
  '''^\.agents/''',
  '''^\.claude/''',
]
regexes = [
  # Placeholders de ejemplo/documentación
  '''(?i)example[_-]?(api)?[_-]?key''',
  '''(?i)x{8,}''',
  '''000000000000000000000000''',
]

# Regla extra: tokens genéricos de alta entropía en TS/JS
[[rules]]
id = "generic-api-key-mathia"
description = "Genérico: posible API key en código fuente"
regex = '''(?i)(apikey|api_key|secret|token|password)\s*[:=]\s*['"][A-Za-z0-9+/_\-]{24,}={0,2}['"]'''
keywords = ["apikey", "api_key", "secret", "token", "password"]
path = '''\.(ts|tsx|js|jsx|rs|toml|json|ya?ml)$'''

[rules.generic-api-key-mathia.allowlist]
regexes = [
  '''(?i)(process\.env\.[A-Z_]+|import\.meta\.env\.[A-Z_]+)''',
  '''(?i)test|mock|fake|dummy|placeholder|changeme|example''',
]
