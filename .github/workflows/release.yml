name: Release

# Despliegue automático: push de tag `v*` (o manual) → builds de escritorio
# (Windows/macOS/Linux) + Android → draft de GitHub Release con todos los
# artefactos y manifiesto de auto-actualización (latest.json).
#
# Secrets opcionales que habilitan firma:
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD  → updater desktop
#   ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
#   ANDROID_KEY_PASSWORD                                            → APK firmado

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc antigua = máxima compatibilidad Linux
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: macos-latest
            target: universal-apple-darwin # Intel + Apple Silicon en un binario
            args: "--target universal-apple-darwin"
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Instalar dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Build + publicar en el release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Mathia ${{ github.ref_name }}"
          releaseBody: "Descarga el instalador para tu plataforma."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android:
    name: Android (APK por ABI)
    runs-on: ubuntu-latest
    needs: [desktop]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager --install "ndk;27.0.12077973" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      - name: Decodificar keystore (si está configurado)
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/mathia.keystore

      - name: Build Android (APKs)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          TAURI_ANDROID_KEYSTORE_PATH: /tmp/mathia.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            unset TAURI_ANDROID_KEYSTORE_PATH
            echo "::warning::Sin keystore: los APKs salen sin firma de release"
          fi
          npx tauri android build --apk --split-per-abi

      - name: Subir APKs al release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apks=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | sort)
          echo "APKs encontrados:"; echo "$apks"
          gh release upload "${{ github.ref_name }}" $apks --clobber --repo "$GITHUB_REPOSITORY"
